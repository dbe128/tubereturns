name: CI/CD

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in backend-jar frontend-dist; do
            gh api repos/${{ github.repository }}/actions/artifacts --paginate \
              | jq -rs --arg name "$name" \
                  '[.[].artifacts[] | select(.name == $name)] | sort_by(.created_at) | reverse | .[3:][].id' \
              | xargs -r -I{} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{} || true
          done

  test-backend:
    needs: cleanup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: build/libs/*.jar
          retention-days: 1

  test-frontend:
    needs: cleanup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11.5.2
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build-backend-image:
    needs: test-backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: build/libs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/dbe128/tubereturns-backend:latest
            ghcr.io/dbe128/tubereturns-backend:${{ github.sha }}

  build-frontend-image:
    needs: test-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile.package
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/dbe128/tubereturns-frontend:latest
            ghcr.io/dbe128/tubereturns-frontend:${{ github.sha }}

  deploy:
    needs: [build-backend-image, build-frontend-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/tubereturns/

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: POSTGRES_HOST,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET,APP_BASE_URL,YOUTUBE_API_KEY,OPENROUTER_API_KEY,RESEND_API_KEY,MAIL_FROM,GH_TOKEN
          script: |
            set -euo pipefail
            export PATH=$PATH:/home/linuxbrew/.linuxbrew/bin
            mkdir -p ~/tubereturns && cd ~/tubereturns
            {
              printf 'POSTGRES_HOST="%s"\n'       "$POSTGRES_HOST"
              printf 'POSTGRES_USER="%s"\n'       "$POSTGRES_USER"
              printf 'POSTGRES_PASSWORD="%s"\n'   "$POSTGRES_PASSWORD"
              printf 'JWT_SECRET="%s"\n'          "$JWT_SECRET"
              printf 'APP_BASE_URL="%s"\n'        "$APP_BASE_URL"
              printf 'YOUTUBE_API_KEY="%s"\n'     "$YOUTUBE_API_KEY"
              printf 'OPENROUTER_API_KEY="%s"\n'  "$OPENROUTER_API_KEY"
              printf 'RESEND_API_KEY="%s"\n'       "$RESEND_API_KEY"
              printf 'MAIL_FROM="%s"\n'           "$MAIL_FROM"
            } > .env
            chmod 600 .env
            docker system prune -f
            echo "$GH_TOKEN" | docker login ghcr.io -u dbe128 --password-stdin
            docker pull ghcr.io/dbe128/tubereturns-backend:latest
            docker pull ghcr.io/dbe128/tubereturns-frontend:latest
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans

  health-check:
    name: Wait for healthy backend
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Wait for backend
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          EXPECTED=$(grep '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          echo "Waiting for backend version $EXPECTED to become healthy..."
          for i in $(seq 1 18); do
            RESPONSE=$(curl -sf "${APP_BASE_URL}/api/admin/health" 2>/dev/null || true)
            DEPLOYED=$(echo "$RESPONSE" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$DEPLOYED" = "$EXPECTED" ]; then
              echo "Backend is healthy at version $EXPECTED"
              exit 0
            fi
            if [ $i -eq 18 ]; then
              echo "Health check timed out — expected $EXPECTED, got '${DEPLOYED:-no response}'"
              exit 1
            fi
            sleep 10
          done


