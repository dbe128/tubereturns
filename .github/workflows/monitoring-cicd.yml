name: Deploy monitoring stack

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Copy monitoring files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.monitoring.yml,prometheus.yml
          target: ~/tubereturns/

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GRAFANA_PASSWORD
          script: |
            export PATH=$PATH:/home/linuxbrew/.linuxbrew/bin
            cd ~/tubereturns
            printf 'export GRAFANA_PASSWORD=%q\n' "$GRAFANA_PASSWORD" > .env.monitoring.sh
            chmod 600 .env.monitoring.sh
            source .env.monitoring.sh
            docker compose -f docker-compose.monitoring.yml pull
            docker compose -f docker-compose.monitoring.yml up -d --remove-orphans
