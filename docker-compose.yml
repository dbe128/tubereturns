services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tubereturns
      POSTGRES_USER: tubereturns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubereturns"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tubereturns
      SPRING_DATASOURCE_USERNAME: tubereturns
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      TUBERETURNS_YT_DLP_COOKIES_PATH: /run/secrets/cookies.txt
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./src/main/resources/cookies.txt:/run/secrets/cookies.txt:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
