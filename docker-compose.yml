services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tubereturns
      POSTGRES_USER: tubereturns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubereturns"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    platform: linux/amd64
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tubereturns
      SPRING_DATASOURCE_USERNAME: tubereturns
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - transcripts_data:/app/transcripts
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  transcripts_data:
