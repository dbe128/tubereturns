spring:
  application:
    name: tubereturns

  config:
    import: classpath:channels-config.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/tubereturns
    username: tubereturns
    password: tubereturns_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

tubereturns:
  youtube:
    enabled: true
    api-key: ${YOUTUBE_API_KEY:}

  yt-dlp:
    enabled: true
    path: yt-dlp
    timeout-seconds: 300

  ai:
    enabled: true
    provider: openrouter
    api-key: ${OPENROUTER_API_KEY:}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36}:%L - %msg%n"
  level:
    com.tubereturns: INFO
    org.springframework.web: INFO

server:
  port: 8080
