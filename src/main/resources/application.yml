spring:
  application:
    name: tubereturns

  config:
    import: classpath:channels-config.yml

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:tubereturns@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 30000

  datasource:
    url: jdbc:postgresql://localhost:5432/tubereturns
    username: tubereturns
    password: tubereturns_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

tubereturns:
  youtube:
    enabled: true
    api-key: ${YOUTUBE_API_KEY:}
    channel-filter-keywords: "investing,finance,investor,stocks,stock market,stock analysis,trading,portfolio,dividend,etf,befektetés,pénzügy,befektető,részvény,tőzsde,részvényelemzés,kereskedés,portfólió,osztalék,investieren,geldanlage,finanzen,anleger,aktien,börse,aktienmarkt,aktienanalyse,dividende,depot"

  transcript:
    ytbsd-path: /app/scripts/ytbsd.py
    transcripts-dir: /app/transcripts
    timeout-seconds: 120

  ai:
    enabled: false
    provider: openrouter
    api-key: ${OPENROUTER_API_KEY:}
    models-file: llm-models.txt
    model-reset-minutes: 60
    connect-timeout-seconds: 10
    read-timeout-seconds: 180
    timeout-retries: 3

  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  app:
    base-url: ${APP_BASE_URL:http://localhost}
    from-email: ${MAIL_FROM:noreply@tubereturns.com}

  pipeline:
    discovery:
      cron: "0 0 * * * *"
      max-items: 500
    transcript:
      cron: "0 15 * * * *"
      batch-size: 300
    extraction:
      cron: "0 30 * * * *"
    price-refresh:
      cron: "0 0 14,18,22 * * *"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36}:%L - %msg%n"
  level:
    com.tubereturns: INFO
    org.springframework.web: INFO

server:
  port: 8080
