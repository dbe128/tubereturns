spring:
  application:
    name: tubereturns

  config:
    import: classpath:channels-config.yml

  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 30000

  datasource:
    url: jdbc:postgresql://localhost:5432/tubereturns
    username: tubereturns
    password: tubereturns_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        generate_statistics: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
        spring.data.repository.invocations: true

tubereturns:
  youtube:
    enabled: true
    api-key: ${YOUTUBE_API_KEY:}
    channel-filter-keywords: "investing,finance,investor,stocks,stock market,stock analysis,trading,portfolio,dividend,etf,befektetés,pénzügy,befektető,részvény,tőzsde,részvényelemzés,kereskedés,portfólió,osztalék,investieren,geldanlage,finanzen,anleger,aktien,börse,aktienmarkt,aktienanalyse,dividende,depot"

  channel:
    relevance-threshold: 3
    relevance-max-retries: 5

  transcript:
    ytbsd-path: /app/scripts/ytbsd.py
    transcripts-dir: /app/transcripts
    timeout-seconds: 120

  ai:
    api-key: ${OPENROUTER_API_KEY:}
    models-file: llm-models.txt
    model-reset-minutes: 60
    connect-timeout-seconds: 10
    read-timeout-seconds: 180
    timeout-retries: 3

  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  app:
    base-url: ${APP_BASE_URL:http://localhost}
    from-email: ${MAIL_FROM:noreply@tubereturns.com}

  pipeline:
    discovery:
      cron: "0 0 * * * *"
      max-items: 1500
    transcript:
      cron: "0 15 * * * *"
      batch-size: 300
    extraction:
      cron: "0 30 * * * *"
      threads: 10
    price-refresh:
      cron: "0 0 14,18,22 * * *"
    notification:
      cron: "0 */2 * * * *"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36}:%L - %msg%n"
  level:
    com.tubereturns: INFO
    org.springframework.web: INFO

server:
  port: 8080

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
