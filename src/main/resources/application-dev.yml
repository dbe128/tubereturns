spring:
  config:
    import: classpath:channels-config.yml
  datasource:
    url: jdbc:h2:mem:tubereturns
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

tubereturns:
  youtube:
    enabled: false
    api-key: ${YOUTUBE_API_KEY:}

  yt-dlp:
    enabled: true
    path: yt-dlp
    timeout-seconds: 300

  ai:
    enabled: true
    provider: gemini
    api-key: ${GEMINI_API_KEY:}

  stock-data:
    enabled: false
    provider: mock
    api-key: ${STOCK_API_KEY:}

  extraction:
    mock-mode: false

  performance:
    mock-mode: true

logging:
  level:
    com.tubereturns: DEBUG
    org.springframework.web: DEBUG