spring:
  datasource:
    url: jdbc:h2:mem:tubereturns;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

tubereturns:
  app:
    base-url: http://localhost:4200
  transcript:
    ytbsd-path: scripts/ytbsd.py
    transcripts-dir: transcripts

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
