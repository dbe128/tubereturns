spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

tubereturns:
  youtube:
    enabled: true
    api-key: ${YOUTUBE_API_KEY}

  ai:
    api-key: ${OPENROUTER_API_KEY}

  pipeline:
    stock-resolution:
      enabled: false

logging:
  level:
    com.tubereturns: INFO
    org.springframework.web: WARN
    root: WARN
