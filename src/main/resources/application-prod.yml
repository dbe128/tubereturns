spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tubereturns}
    username: ${DB_USERNAME:tubereturns}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

tubereturns:
  youtube:
    enabled: true
    api-key: ${YOUTUBE_API_KEY}

  yt-dlp:
    enabled: true
    path: yt-dlp
    timeout-seconds: 300

  ai:
    enabled: true
    provider: openai
    api-key: ${AI_API_KEY}

  stock-data:
    enabled: true
    provider: alphavantage
    api-key: ${STOCK_API_KEY}

  extraction:
    mock-mode: false

  performance:
    mock-mode: false

logging:
  level:
    com.tubereturns: INFO
    root: WARN