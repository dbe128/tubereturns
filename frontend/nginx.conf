map $http_user_agent $is_bot {
    default 0;
    ~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandex(bot)?|gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|anthropic-ai|perplexitybot|google-extended|applebot|amazonbot|ccbot|bytespider|facebookexternalhit|twitterbot|linkedinbot|slackbot|telegrambot|whatsapp|discordbot) 1;
}

map $request_uri $loggable {
    ~^/grafana/ 0;
    ~*\.(js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|map)(\?|$) 0;
    default 1;
}

log_format access_json escape=json '{'
    '"time":"$time_iso8601",'
    '"client_ip":"$http_cf_connecting_ip",'
    '"country":"$http_cf_ipcountry",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"is_bot":$is_bot'
'}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log access_json if=$loggable;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location = /llms.txt {
        proxy_pass http://backend:8080/api/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /grafana/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana http://grafana:3000;
        proxy_pass $grafana$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        if ($is_bot) {
            rewrite ^ /api/bot/ last;
        }
        try_files /index.html =404;
    }

    location ~ ^/(channel|stock)/ {
        if ($is_bot) {
            rewrite ^(.*)$ /api/bot$1 last;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
