services:
  backend:
    image: ghcr.io/dbe128/tubereturns-backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-tubereturns}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_BASE_URL: ${APP_BASE_URL}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@tubereturns.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - transcripts_data:/app/transcripts
      - playwright_browsers:/root/.cache/ms-playwright
    restart: unless-stopped

  frontend:
    image: ghcr.io/dbe128/tubereturns-frontend:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ubuntu/tesco:/usr/share/nginx/html/tesco:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  transcripts_data:
  playwright_browsers:
